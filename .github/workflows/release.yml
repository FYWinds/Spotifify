name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: Git tag of the release to attach binaries to
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing git tag to (re)build binaries for
        required: true
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Cross-compile and package
        # The executables embed the Bun runtime (70-90 MB). UPX-style packers break Bun's embedded
        # module graph, so downloads are kept small with plain archives instead (xz ≈ 3x smaller).
        run: |
          set -euo pipefail
          mkdir -p out
          for target in bun-windows-x64 bun-linux-x64 bun-linux-arm64 bun-darwin-arm64 bun-darwin-x64; do
            platform="${target#bun-}"
            rm -rf "build/$platform" && mkdir -p "build/$platform"
            if [ "$platform" = windows-x64 ]; then
              bun run scripts/build.ts --target "$target" --outfile "build/$platform/spotifify"
              (cd "build/$platform" && zip -9 -q "../../out/spotifify-$platform.zip" spotifify.exe)
            else
              bun run scripts/build.ts --target "$target" --outfile "build/$platform/spotifify"
              tar -C "build/$platform" -cJf "out/spotifify-$platform.tar.xz" spotifify
            fi
          done
          (cd out && sha256sum spotifify-* > SHA256SUMS && ls -l)
      - name: Ensure the GitHub release exists
        run: gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes
      - name: Upload assets
        run: gh release upload "$TAG" out/spotifify-* out/SHA256SUMS --clobber

  npm:
    # OIDC trusted publishing (no token). npm validates the *calling* workflow's filename, so the
    # trusted publisher on npmjs.com must name release-please.yml (automatic releases) and
    # release.yml (manual dispatch). Skipped until the repository variable NPM_PUBLISH is "true".
    if: vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - name: Skip if this version is already on npm
        id: check
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "spotifify@$v" version >/dev/null 2>&1; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.check.outputs.skip != 'true'
        run: npm publish --provenance --access public
